name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # Common VIAMD + mdlib configuration
  VIAMD_CMAKE_FLAGS: >-
    -DVIAMD_ENABLE_QM=ON
    -DMD_ENABLE_VLX=ON
    -DMD_ENABLE_TREXIO=ON
    -DMD_BENCHMARK=OFF
    -DMD_UNITTEST=OFF

  # Static library configuration
  STATIC_CMAKE_FLAGS: >-
    -DBUILD_SHARED_LIBS=OFF
    -DBUILD_STATIC_LIBS=ON

  # x86-specific SIMD configuration
  AVX2_CMAKE_FLAGS: >-
    -DMD_ENABLE_AVX=ON
    -DMD_ENABLE_AVX2=ON
    -DMD_ENABLE_AVX512=OFF
    -DMD_ENABLE_FMA=ON


jobs:
  build-macos-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: hdf5
          triplet: arm64-osx-release
          token: ${{ github.token }}
          github-binarycache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-release \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DHDF5_USE_STATIC_LIBRARIES=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DVIAMD_CREATE_MACOSX_BUNDLE=ON \
            $STATIC_CMAKE_FLAGS \
            $VIAMD_CMAKE_FLAGS

      - name: Build
        run: |
          cmake --build build --target viamd

      - name: Codesign
        run: |
          APP="build/bin/viamd.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Archive
        run: |
          ditto -c -k --keepParent --sequesterRsrc \
            build/bin/viamd.app \
            viamd_macos_arm64.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: viamd_macos_arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-macos-x64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: hdf5
          triplet: x64-osx-release
          token: ${{ github.token }}
          github-binarycache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake \
            -DVCPKG_TARGET_TRIPLET=x64-osx-release \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DHDF5_USE_STATIC_LIBRARIES=TRUE \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13 \
            -DVIAMD_CREATE_MACOSX_BUNDLE=ON \
            $STATIC_CMAKE_FLAGS \
            $VIAMD_CMAKE_FLAGS \
            $AVX2_CMAKE_FLAGS

      - name: Build
        run: |
          cmake --build build --target viamd

      - name: Codesign
        run: |
          APP="build/bin/viamd.app"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Archive
        run: |
          ditto -c -k --keepParent --sequesterRsrc \
            build/bin/viamd.app \
            viamd_macos_x64_avx2.zip

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: viamd_macos_x64_avx2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-windows-x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: hdf5
          triplet: x64-windows-static-release
          token: ${{ github.token }}
          github-binarycache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static-release `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF `
            $env:STATIC_CMAKE_FLAGS `
            $env:VIAMD_CMAKE_FLAGS `
            $env:AVX2_CMAKE_FLAGS

      - name: Build
        run: |
          cmake --build build --config Release -- /nologo /verbosity:minimal /maxcpucount:4

      - name: Archive
        uses: thedoctor0/zip-release@main
        with:
          type: zip
          filename: viamd_win_x64_avx2.zip
          path: build/bin/Release/.

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: viamd_win_x64_avx2.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  build-windows-arm64:
    runs-on: windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build dependencies
        uses: johnwason/vcpkg-action@v6
        with:
          pkgs: hdf5
          triplet: arm64-windows-static-release
          token: ${{ github.token }}
          github-binarycache: true

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=arm64-windows-static-release `
            -DVCPKG_MANIFEST_MODE=OFF `
            -DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF `
            $env:STATIC_CMAKE_FLAGS `
            $env:VIAMD_CMAKE_FLAGS

      - name: Build
        run: |
          cmake --build build --config Release -- /nologo /verbosity:minimal /maxcpucount:4

      - name: Archive
        uses: thedoctor0/zip-release@main
        with:
          type: zip
          filename: viamd_win_arm64.zip
          path: build/bin/Release/.

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: viamd_win_arm64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}