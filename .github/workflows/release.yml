name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # These are intentionally strings here. On Windows they are converted to
  # PowerShell arrays before being passed to cmake, so each -D option becomes
  # a separate native command-line argument.
  VIAMD_CMAKE_FLAGS: >-
    -DVIAMD_ENABLE_QM=ON
    -DMD_ENABLE_VLX=ON
    -DMD_ENABLE_TREXIO=ON
    -DMD_BENCHMARK=OFF
    -DMD_UNITTEST=OFF

  STATIC_CMAKE_FLAGS: >-
    -DBUILD_SHARED_LIBS=OFF
    -DBUILD_STATIC_LIBS=ON

  AVX2_CMAKE_FLAGS: >-
    -DMD_ENABLE_AVX=ON
    -DMD_ENABLE_AVX2=ON
    -DMD_ENABLE_AVX512=OFF
    -DMD_ENABLE_FMA=ON


jobs:

  # ---------------------------------------------------------------------------
  # macOS ARM64
  # ---------------------------------------------------------------------------

  build-macos-arm64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg build
        uses: johnwason/vcpkg-action@v6
        id: vcpkg
        with:
          pkgs: hdf5
          triplet: arm64-osx-release
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.toolchainFile }}" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx-release \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13 \
            -DVIAMD_CREATE_MACOSX_BUNDLE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DVIAMD_ENABLE_QM=ON \
            -DMD_ENABLE_VLX=ON \
            -DMD_ENABLE_TREXIO=ON \
            -DMD_BENCHMARK=OFF \
            -DMD_UNITTEST=OFF

      - name: Build
        run: |
          cmake --build build --config Release --parallel 4

      - name: Code sign
        run: |
          codesign --deep --force --verbose \
            --sign - \
            build/VIAMD.app

      - name: Package
        run: |
          cd build
          zip -r ../viamd_macos_arm64.zip VIAMD.app

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: viamd_macos_arm64.zip


  # ---------------------------------------------------------------------------
  # macOS x64
  # ---------------------------------------------------------------------------

  build-macos-x64:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg build
        uses: johnwason/vcpkg-action@v6
        id: vcpkg
        with:
          pkgs: hdf5
          triplet: x64-osx-release
          cache: true

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.vcpkg.outputs.toolchainFile }}" \
            -DVCPKG_TARGET_TRIPLET=x64-osx-release \
            -DVCPKG_MANIFEST_MODE=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13 \
            -DVIAMD_CREATE_MACOSX_BUNDLE=ON \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DVIAMD_ENABLE_QM=ON \
            -DMD_ENABLE_VLX=ON \
            -DMD_ENABLE_TREXIO=ON \
            -DMD_BENCHMARK=OFF \
            -DMD_UNITTEST=OFF \
            -DMD_ENABLE_AVX=ON \
            -DMD_ENABLE_AVX2=ON \
            -DMD_ENABLE_AVX512=OFF \
            -DMD_ENABLE_FMA=ON

      - name: Build
        run: |
          cmake --build build --config Release --parallel 4

      - name: Code sign
        run: |
          codesign --deep --force --verbose \
            --sign - \
            build/VIAMD.app

      - name: Package
        run: |
          cd build
          zip -r ../viamd_macos_x64_avx2.zip VIAMD.app

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: viamd_macos_x64_avx2.zip


  # ---------------------------------------------------------------------------
  # Windows x64
  # ---------------------------------------------------------------------------

  build-windows-x64:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg build
        uses: johnwason/vcpkg-action@v6
        id: vcpkg
        with:
          pkgs: hdf5
          triplet: x64-windows-static-release
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          # Each env var contains multiple -D flags. If PowerShell passes a
          # whole flag string through as one argument, CMake sees
          # BUILD_SHARED_LIBS as the truthy value "OFF -DBUILD_STATIC_LIBS=ON"
          # and starts generating DLL targets instead of static libraries.
          $static_flags = $env:STATIC_CMAKE_FLAGS -split '\s+' | Where-Object { $_ }
          $common_flags = $env:VIAMD_CMAKE_FLAGS -split '\s+' | Where-Object { $_ }
          $avx2_flags   = $env:AVX2_CMAKE_FLAGS -split '\s+' | Where-Object { $_ }

          $cmake_args = @(
            "-DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.toolchainFile }}"
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static-release'
            '-DVCPKG_MANIFEST_MODE=OFF'
            '-DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF'
          ) + $static_flags + $avx2_flags + $common_flags + '.'

          & cmake @cmake_args

      - name: Build
        shell: pwsh
        run: |
          cmake --build . --config Release -- /nologo /verbosity:minimal /maxcpucount:4

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path bin/Release/* `
            -DestinationPath viamd_windows_x64_avx2.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: viamd_windows_x64_avx2.zip


  # ---------------------------------------------------------------------------
  # Windows ARM64
  # ---------------------------------------------------------------------------

  build-windows-arm64:
    runs-on: windows-11-vs2026-arm

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: vcpkg build
        uses: johnwason/vcpkg-action@v6
        id: vcpkg
        with:
          pkgs: hdf5
          triplet: arm64-windows-static-release
          cache: true

      - name: Configure
        shell: pwsh
        run: |
          $static_flags = $env:STATIC_CMAKE_FLAGS -split '\s+' | Where-Object { $_ }
          $common_flags = $env:VIAMD_CMAKE_FLAGS -split '\s+' | Where-Object { $_ }

          $cmake_args = @(
            "-DCMAKE_TOOLCHAIN_FILE=${{ steps.vcpkg.outputs.toolchainFile }}"
            '-DVCPKG_TARGET_TRIPLET=arm64-windows-static-release'
            '-DVCPKG_MANIFEST_MODE=OFF'
            '-DUSE_MSVC_RUNTIME_LIBRARY_DLL=OFF'
          ) + $static_flags + $common_flags + '.'

          & cmake @cmake_args

      - name: Build
        shell: pwsh
        run: |
          cmake --build . --config Release -- /nologo /verbosity:minimal /maxcpucount:4

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path bin/Release/* `
            -DestinationPath viamd_windows_arm64.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: viamd_windows_arm64.zip